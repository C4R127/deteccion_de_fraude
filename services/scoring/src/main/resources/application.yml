server:
  port: 8082

spring:
  application:
    name: scoring
  # Secretos desde el .env de la raíz (ejecutando desde la raíz o desde el módulo).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/fraude
    username: scoring
    password: ${SCORING_DB_PASSWORD}
    hikari:
      schema: scoring
  data:
    redis:
      # Valkey (lo escribe perfiles; scoring solo lee).
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # Reglas de Kafka de CLAUDE.md: confirmación de todas las réplicas e idempotencia.
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
  flyway:
    schemas: scoring
    default-schema: scoring
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: scoring
        jdbc:
          time_zone: UTC

scoring:
  # Debe ser el mismo tiempo límite que usa transacciones (ADR 0012).
  tiempo-limite: 200ms
  umbrales:
    # §7.3: 0–39 APROBAR, 40–69 REVISAR, 70–100 RECHAZAR.
    revisar: 40
    rechazar: 70

outbox:
  publicador:
    intervalo: 200ms
    espera-ack: 30s
  purga:
    intervalo: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
