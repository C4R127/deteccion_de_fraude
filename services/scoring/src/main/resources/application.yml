server:
  port: 8082

spring:
  application:
    name: scoring
  # Secretos desde el .env de la raíz (ejecutando desde la raíz o desde el módulo).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/fraude
    username: scoring
    password: ${SCORING_DB_PASSWORD}
    hikari:
      schema: scoring
      maximum-pool-size: 16
  data:
    redis:
      # Valkey (lo escribe perfiles; scoring solo lee).
      host: localhost
      port: 6379
      lettuce:
        # El pipeline de PerfilLector necesita una conexión dedicada: sin pool se abriría una
        # por evaluación. min-idle se llena en segundo plano cada time-between-eviction-runs.
        pool:
          enabled: true
          max-active: 32
          max-idle: 32
          min-idle: 16
          time-between-eviction-runs: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/fraude
          audiences: servicios
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: scoring
      auto-offset-reset: earliest
      # Reglas de Kafka de CLAUDE.md: offsets confirmados solo después del efecto.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      # Reglas de Kafka de CLAUDE.md: confirmación de todas las réplicas e idempotencia.
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
  flyway:
    schemas: scoring
    default-schema: scoring
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: scoring
        jdbc:
          time_zone: UTC

scoring:
  # Debe ser el mismo tiempo límite que usa transacciones (ADR 0012).
  tiempo-limite: 200ms
  umbrales:
    # §7.3: 0–39 APROBAR, 40–69 REVISAR, 70–100 RECHAZAR.
    revisar: 40
    rechazar: 70

outbox:
  publicador:
    intervalo: 200ms
    espera-ack: 30s
  purga:
    intervalo: 1h

calentamiento:
  # Riesgo "arranque en frío": llamadas sin efectos al arrancar, antes de recibir tráfico.
  habilitado: true
  # Fase paralela: iteraciones mínimas; fase de a una: hasta bajar del objetivo.
  iteraciones-minimas: 400
  objetivo: 20ms
  duracion-maxima: 20s
  # Iteraciones en paralelo: abre las conexiones de los pools antes de recibir tráfico.
  hilos: 16

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
