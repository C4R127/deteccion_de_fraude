server:
  port: 8082

spring:
  application:
    name: scoring
  # Secretos desde el .env de la raíz (ejecutando desde la raíz o desde el módulo).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/fraude
    username: scoring
    password: ${SCORING_DB_PASSWORD}
    hikari:
      schema: scoring
  data:
    redis:
      # Valkey (lo escribe perfiles; scoring solo lee).
      host: localhost
      port: 6379
  flyway:
    schemas: scoring
    default-schema: scoring
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: scoring
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
