server:
  port: 8081

spring:
  application:
    name: transacciones
  # Secretos desde el .env de la raíz (ejecutando desde la raíz o desde el módulo).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/fraude
    username: transacciones
    password: ${TRANSACCIONES_DB_PASSWORD}
    hikari:
      schema: transacciones
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/fraude
          audiences: servicios
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # Reglas de Kafka de CLAUDE.md: confirmación de todas las réplicas e idempotencia.
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
  flyway:
    schemas: transacciones
    default-schema: transacciones
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: transacciones
        jdbc:
          time_zone: UTC

scoring:
  url: http://localhost:8082
  # Tiempo máximo para la decisión antes de aplicar el respaldo (§3 paso 4).
  tiempo-limite: 200ms

outbox:
  publicador:
    intervalo: 200ms
    espera-ack: 30s
  purga:
    intervalo: 1h

management:
  endpoints:
    web:
      exposure:
        # metrics expone outbox.pendientes y outbox.fallos.
        include: health,info,metrics
