# Infraestructura local. Los puertos se publican solo en 127.0.0.1: nada queda expuesto a la
# red, porque las contraseñas de ejemplo de .env.example son públicas.
# Uso (desde la raíz del repositorio, con .env creado a
# partir de .env.example):
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml down -v   # borra datos
name: fraude

services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: fraude-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNO://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Los datos (tópicos, changelog de perfiles, offsets) en el volumen kafka-datos: sin esto la
      # imagen escribe en /tmp del contenedor y todo se pierde cuando se recrea.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-datos:/var/lib/kafka/data
      - ./kafka:/opt/fraude:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-topicos:
    image: apache/kafka:4.3.2
    container_name: fraude-kafka-topicos
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka:19092
    volumes:
      - ./kafka:/opt/fraude:ro
    entrypoint: ["/bin/bash", "/opt/fraude/crear-topicos.sh"]
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: fraude-kafka-ui
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16.15
    container_name: fraude-postgres
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - path: ../.env
        required: true
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8.1.11-alpine
    container_name: fraude-valkey
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-datos:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: fraude-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8180:8080"
    env_file:
      - path: ../.env
        required: true
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8080
    volumes:
      - ./keycloak/realm-fraude.json:/opt/keycloak/data/import/realm-fraude.json:ro
    healthcheck:
      # La imagen no trae curl: se consulta /health/ready (puerto de gestión 9000) con bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Observabilidad (Tarea 6.5): http://localhost:9090 (alertas en /alerts) y http://localhost:3000.
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: fraude-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    # Los servicios corren en la máquina; host-gateway hace que el nombre funcione también en Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-datos:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:12.4.14
    container_name: fraude-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: ../.env
        required: true
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fraude.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-datos:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  kafka-datos:
  postgres-datos:
  valkey-datos:
  prometheus-datos:
  grafana-datos:
