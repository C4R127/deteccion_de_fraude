# Build y pruebas en cada push y pull request (Tarea 6.3).
# Las pruebas de integración usan Testcontainers: el runner de Ubuntu trae Docker.
# Las acciones van fijadas por SHA de commit (con la versión en el comentario): un tag
# como @v4 se mueve solo (CLAUDE.md: "fija versiones").
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Los application.yml leen secretos de .env; en CI se usan los valores de ejemplo
      # (las pruebas no tocan la infraestructura local: usan Testcontainers).
      - name: Preparar .env de ejemplo
        run: cp .env.example .env
      - name: Build y pruebas
        run: ./mvnw -B -ntp verify

  generador:
    name: Generador (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: generador
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generador/pyproject.toml
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Pruebas
        run: pytest -q

  frontend:
    name: Frontend (Vitest y build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        run: npm ci
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build
